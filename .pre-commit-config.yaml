repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace
        exclude: ^alembic/
    -   id: end-of-file-fixer
        exclude: ^alembic/
    -   id: check-yaml
    -   id: check-added-large-files

-   repo: https://github.com/python-poetry/poetry
    rev: '1.7.1'
    hooks:
    -   id: poetry-check
    -   id: poetry-lock
        args: ["--check"]

-   repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
    -   id: isort
        exclude: ^alembic/

-   repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
    -   id: flake8
        exclude: ^alembic/

-   repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
    -   id: pydocstyle
        additional_dependencies: [toml]
        exclude: ^alembic/

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
    -   id: mypy
        additional_dependencies:
            # Type Stubs (mostly from dev group)
            - "types-requests"
            - "types-python-dateutil"
            - "types-toml"
            - "types-passlib>=1.7.7"
            - "types-factory-boy>=0.4.1"

            # Core Dependencies Mypy needs to see
            - "pydantic>=2.11.1"
            - "sqlalchemy>=2.0.40"
            - "pydantic-settings>=2.8.1"
            - "fastapi>=0.115.12"
            - "passlib[bcrypt]>=1.7.4,<1.8.0"
            - "python-jose[cryptography]>=3.4.0,<4.5.0"
            - "asyncpg>=0.30.0,<0.31.0"
            - "httpx>=0.27.0"
            - "factory-boy>=3.3.0,<3.4.0"
            - "async-factory-boy>=1.0.1,<1.1.0"
            - "faker>=37.1.0"
        exclude: ^alembic/
